global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Métriques du backup PRA via node_exporter (textfile collector)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # Agents d'audit forensique (optionnel — nécessite docker-compose.forensique.yml)
